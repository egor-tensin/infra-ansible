- name: Create service override
  loop: '{{ systemd_depend_mount_services }}'
  become: true
  tensin.infra.template:
    src: override.conf.j2
    dest: '/etc/systemd/system/{{ item }}.service.d/depend_mount_{{ systemd_depend_mount_dir | regex_replace("/", "_") }}.conf'
    owner: root
    group: root
    mode: '0644'
  notify: systemd_depend_mount_reload

- name: Reload systemd services if necessary
  ansible.builtin.meta: flush_handlers
