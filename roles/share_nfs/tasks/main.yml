- name: Install NFS
  become: true
  ansible.builtin.package:
    name: nfs-server
    state: present

- name: Enable & start NFS service
  become: true
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started

- name: Collect required info
  ansible.builtin.setup:
    gather_subset: [user]

- name: Configure NFS
  become: true
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  register: share_nfs_config

- name: Reload NFS mounts
  when: share_nfs_config is changed
  become: true
  ansible.builtin.command: /usr/sbin/exportfs -arv
  changed_when: true
