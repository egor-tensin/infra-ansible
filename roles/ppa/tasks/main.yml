- name: Get host distro
  ansible.builtin.setup:
    gather_subset:
      - distribution
      - distribution_release

- name: Set platform-specific variables
  loop:
    - "{{ ansible_facts['distribution'] }}.yml"
    - "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_release'] }}.yml"
  vars:
    __ppa_vars_file: '{{ role_path }}/vars/{{ item }}'
  when: __ppa_vars_file is exists
  ansible.builtin.include_vars: '{{ __ppa_vars_file }}'

- name: Set up PPA repository
  become: true
  ansible.builtin.deb822_repository:
    name: '{{ ppa_name }}'
    uris: 'https://ppa.launchpadcontent.net/{{ ppa_owner }}/{{ ppa_name }}/ubuntu'
    state: present
    signed_by: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ ppa_key }}'
    suites: '{{ ppa_distro }}'
    components: main
  register: ppa_setup

- name: Update apt cache
  when: ppa_setup is changed
  become: true
  ansible.builtin.apt:
    update_cache: true
