- name: Configure makepkg
  ansible.builtin.import_tasks: makepkg.yml

- name: Set up yay
  # Here instead of meta/ so that the stupid debug packages are already
  # disabled.
  ansible.builtin.import_role:
    name: yay

- name: Upgrade AUR packages
  # Again, here instead of meta/ for the same reason.
  ansible.builtin.import_role:
    name: system_upgrade
  vars:
    system_upgrade_backend: yay

- name: Set up paccache
  ansible.builtin.import_tasks: paccache.yml

- name: Set up Reflector
  ansible.builtin.import_tasks: reflector.yml
