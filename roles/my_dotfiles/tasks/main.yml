- name: Pull repository
  tensin.infra.safe_git:
    repo: '{{ my_dotfiles_repo }}'
    dest: '{{ my_dotfiles_dir }}'
    version: master
    accept_hostkey: true
  register: my_dotfiles_repo

- name: Run setup.sh
  ansible.builtin.command: ./scripts/setup.sh
  args:
    chdir: '{{ my_dotfiles_dir }}'
  changed_when: true
  when: my_dotfiles_repo.changed
