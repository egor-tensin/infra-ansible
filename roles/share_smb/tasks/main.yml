- name: Install Samba
  become: true
  ansible.builtin.package:
    name: samba
    state: present

- name: Configure Samba
  become: true
  tensin.infra.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/bin/testparm --suppress-prompt %s'
  notify: samba_configured

- name: Enable & start Samba
  become: true
  ansible.builtin.systemd_service:
    name: smbd
    enabled: true
    state: started

- name: Restart Samba service if necessary
  ansible.builtin.meta: flush_handlers

# Enable network discovery on Windows.
- name: Install wsdd
  become: true
  ansible.builtin.package:
    name: wsdd
    state: present

- name: Enable & start wsdd
  become: true
  ansible.builtin.systemd_service:
    name: wsdd
    enabled: true
    state: started
