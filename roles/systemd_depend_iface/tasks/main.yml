- name: Create service override
  loop: '{{ systemd_depend_iface_services }}'
  become: true
  tensin.infra.template:
    src: override.conf.j2
    dest: '/etc/systemd/system/{{ item }}.service.d/depend_iface_{{ systemd_depend_iface_name }}.conf'
    owner: root
    group: root
    mode: '0644'
  notify: systemd_depend_iface_reload

- name: Reload systemd services if necessary
  ansible.builtin.meta: flush_handlers
