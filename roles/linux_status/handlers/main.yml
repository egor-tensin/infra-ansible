# Don't restart if it's not running.
- name: Collect service facts
  listen: linux_status_configured
  ansible.builtin.service_facts:

- name: Reload systemd daemon
  listen: linux_status_configured
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart linux-status service
  listen: linux_status_configured
  when: |
    'linux-status.service' in ansible_facts.services
    and ansible_facts.services['linux-status.service'].state == 'running'
  become: true
  ansible.builtin.systemd_service:
    name: linux-status
    state: restarted
