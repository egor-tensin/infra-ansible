# Don't restart if it's not running.
- name: Collect service facts
  ansible.builtin.service_facts:
  listen: cups_restart

- name: Restart CUPS if necessary
  become: true
  when: |
    'cups.service' in ansible_facts.services and ansible_facts.services['cups.service'].state == 'running'
  ansible.builtin.systemd_service:
    name: cups
    state: restarted
  listen: cups_restart
