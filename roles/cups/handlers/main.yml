# Don't restart if it's not running.
- name: Collect service facts
  listen: cups_restart
  ansible.builtin.service_facts:

- name: Restart CUPS if necessary
  listen: cups_restart
  when: |
    'cups.service' in ansible_facts.services
    and ansible_facts.services['cups.service'].state == 'running'
  become: true
  ansible.builtin.systemd_service:
    name: cups
    state: restarted
