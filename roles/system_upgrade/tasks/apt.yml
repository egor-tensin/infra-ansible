- name: Upgrade packages
  become: true
  tensin.infra.apt_wrapper:
    update_cache: true
    upgrade: dist
  register: system_upgrade_result

- name: Show upgraded packages
  when: system_upgrade_result is changed
  ansible.builtin.debug:
    var: system_upgrade_result.packages | sort

- name: Reboot
  when: system_upgrade_result is changed
  become: true
  ansible.builtin.reboot:
    # 3 minutes is plenty.
    reboot_timeout: 180

- name: Clean up dependencies
  become: true
  tensin.infra.apt_wrapper:
    autoremove: true
    purge: true
  register: system_upgrade_result

- name: Show removed dependencies
  when: system_upgrade_result is changed
  ansible.builtin.debug:
    var: system_upgrade_result.packages | sort
