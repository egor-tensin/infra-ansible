- name: Configure ignored packages
  become: true
  community.general.ini_file:
    path: /etc/pacman.conf
    create: false
    section: options
    option: IgnorePkg
    value: "{{ system_upgrade_ignore_packages | join(' ') }}"

- name: Upgrade packages
  become: true
  community.general.pacman:
    update_cache: true
    upgrade: true
  # According to
  #     https://docs.ansible.com/projects/ansible/latest/collections/community/general/pacman_module.html
  # this module now reports 'changed' even if only the cache was updated, with
  # no upgrades; this is the workaround.
  changed_when: |
    system_upgrade_result.packages is defined
    and (system_upgrade_result.packages | length > 0)
  register: system_upgrade_result

- name: Post-upgrade
  when: system_upgrade_result is changed
  block:
    - name: Show upgraded packages
      ansible.builtin.debug:
        var: system_upgrade_result.packages | sort

    - name: Reboot
      become: true
      ansible.builtin.reboot:
        # 3 minutes is plenty.
        reboot_timeout: 180

- name: Get list of unneeded dependencies
  ansible.builtin.command: pacman -Qqdt
  changed_when: false
  failed_when: |
    system_upgrade_result.rc != 0
    and not (
        system_upgrade_result.rc == 1
        and (system_upgrade_result.stdout_lines | length == 0)
    )
  register: system_upgrade_result

- name: Remove unneeded dependencies
  when: system_upgrade_result.stdout_lines | length > 0
  become: true
  community.general.pacman:
    name: '{{ system_upgrade_result.stdout_lines }}'
    state: absent
    extra_args: --recursive
    remove_nosave: true
  register: system_upgrade_result

- name: Show removed packages
  when: system_upgrade_result.packages is defined
  ansible.builtin.debug:
    var: system_upgrade_result.packages | sort
