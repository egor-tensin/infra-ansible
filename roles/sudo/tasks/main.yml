- name: Install sudo
  become: true
  ansible.builtin.package:
    name: sudo
    state: present

- name: Create /etc/sudoers.d
  become: true
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Configure sudoer
  become: true
  ansible.builtin.template:
    src: sudoers.j2
    dest: '/etc/sudoers.d/{{ sudo_user }}'
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Remove installer entries
  when: sudo_cleanup_installer
  become: true
  loop:
    # cloud-init:
    - 90-cloud-init-users
    # archinstall:
    - '\d{2}_{{ ansible_user }}'
  community.general.file_remove:
    path: /etc/sudoers.d
    pattern: '{{ item }}'
    use_regex: true
