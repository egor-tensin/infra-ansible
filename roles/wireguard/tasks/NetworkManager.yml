- name: Write NetworkManager config file
  become: true
  ansible.builtin.template:
    src: NetworkManager.nmconnection.j2
    dest: '/etc/NetworkManager/system-connections/{{ wireguard_name }}.nmconnection'
    owner: root
    group: root
    mode: '0600'
  register: wireguard_config

- name: Reload NetworkManager connections
  when: wireguard_config is changed
  become: true
  ansible.builtin.command: nmcli connection reload
  changed_when: true

- name: Set up service dependencies for the interface
  vars:
    systemd_depend_iface_name: '{{ wireguard_name }}'
    systemd_depend_iface_services: '{{ wireguard_dependent_services }}'
  ansible.builtin.include_role:
    name: systemd_depend_iface

- name: Set up service dependencies for NetworkManager
  loop: '{{ wireguard_dependent_services }}'
  become: true
  tensin.infra.template:
    src: depend_service_NetworkManager.conf.j2
    dest: '/etc/systemd/system/{{ item }}.service.d/depend_service_NetworkManager.conf'
    owner: root
    group: root
    mode: '0644'
  notify: wireguard_reload

- name: Reload systemd services if necessary
  ansible.builtin.meta: flush_handlers
