name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linting
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run black
        uses: psf/black@stable
        with:
          # https://black.readthedocs.io/en/stable/integrations/github_actions.html#cli-options
          #     Please note that the --check flag is required so that the workflow fails if Black finds files that need to be formattedPlease note that the --check flag is required so that the workflow fails if Black finds files that need to be formatted.
          # ^^^ I don't even have words for this.
          options: --skip-string-normalization --check
